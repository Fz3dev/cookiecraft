<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookieCraft - Test Webflow</title>
  <link rel="stylesheet" href="cookiecraft.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #f5f5f5; }
    h1 { color: #083d33; }
    .card { background: white; padding: 2rem; border-radius: 12px; margin: 1rem 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
    #log { background: #1a1a1a; color: #0f0; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>CookieCraft Test - Stoneo</h1>

  <div class="card">
    <h2>Config Webflow</h2>
    <p>Simule exactement la config qui sera sur Webflow.</p>
    <p>Couleur: <strong style="color:#083d33">#083d33</strong></p>
  </div>

  <div class="card">
    <h2>Actions manuelles</h2>
    <button onclick="cc.show()">Afficher banniere</button>
    <button onclick="cc.showPreferences()">Preferences</button>
    <button onclick="cc.reset()">Reset consent</button>
    <button onclick="console.log(cc.getConsent())">Voir consent</button>
  </div>

  <div class="card">
    <h2>Console</h2>
    <div id="log"></div>
  </div>

  <script src="cookiecraft.min.js"></script>
  <script>
    // Mirror console.log to page
    var logEl = document.getElementById('log');
    var origLog = console.log;
    console.log = function() {
      origLog.apply(console, arguments);
      var msg = Array.from(arguments).map(function(a) {
        return typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a);
      }).join(' ');
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    };

    // Exact same config as Webflow
    var o = {};
    o.mode = 'opt-in';
    o.position = 'bottom';
    o.layout = 'bar';
    o.theme = 'light';
    o.revision = 1;
    o.gtmConsentMode = true;
    o.primaryColor = '#083d33';
    o.categories = {};
    o.categories.necessary = {};
    o.categories.necessary.label = 'Essentiels';
    o.categories.necessary.enabled = true;
    o.categories.necessary.description = 'Cookies necessaires';
    o.categories.necessary.readOnly = true;
    o.categories.analytics = {};
    o.categories.analytics.label = 'Statistiques';
    o.categories.analytics.enabled = false;
    o.categories.analytics.description = 'Comprendre votre utilisation';
    o.categories.analytics.readOnly = false;
    o.categories.marketing = {};
    o.categories.marketing.label = 'Marketing';
    o.categories.marketing.enabled = false;
    o.categories.marketing.description = 'Contenu personnalise';
    o.categories.marketing.readOnly = false;
    o.categories.preferences = {};
    o.categories.preferences.label = 'Preferences';
    o.categories.preferences.enabled = false;
    o.categories.preferences.description = 'Memoriser vos choix';
    o.categories.preferences.readOnly = false;
    o.translations = {};
    o.translations.title = 'Nous utilisons des cookies';
    o.translations.description = 'Pour ameliorer votre experience.';
    o.translations.privacyPolicyUrl = '/politique-de-confidentialite';
    o.translations.privacyPolicyLabel = 'Politique de confidentialite';

    console.log('[Test] Creating CookieCraft...');
    var cc = new CookieCraft.CookieConsent(o);
    console.log('[Test] Calling init()...');
    cc.init();
    console.log('[Test] Done!');
  </script>
</body>
</html>
